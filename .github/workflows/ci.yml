name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  build-android:
    runs-on: ubuntu-latest

    env:
      TURBO_CACHE_DIR: .turbo/android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for Android
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: |
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"

  build-ios:
    runs-on: macos-latest

    env:
      XCODE_VERSION: latest-stable
      TURBO_CACHE_DIR: .turbo/ios
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for iOS
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-

      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Use appropriate Xcode version
        if: env.turbo_cache_hit != 1
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache CocoaPods
        if: env.turbo_cache_hit != 1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock', 'example/Gemfile.lock') }}

      - name: Install cocoapods
        if: env.turbo_cache_hit != 1
        run: |
          cd example
          bundle install
          bundle exec pod install --project-directory=ios

      - name: Build example for iOS
        run: |
          yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}"

  smoke:
    name: Smoke RN ${{ matrix.rn }} (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
    strategy:
      fail-fast: false
      matrix:
        rn: ['0.76.9', 'latest']
        platform: [android, ios]
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
        exclude:
          # RN 0.76's bundled fmt fails to compile with current Xcode (consteval
          # errors), independent of this library.
          - rn: '0.76.9'
            platform: ios
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select stable Xcode
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        if: matrix.platform == 'android'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build and pack library
        shell: bash
        run: |
          yarn prepare
          # yarn pack runs only `prepack` (none here), unlike npm pack which rebuilds.
          yarn pack --out "$RUNNER_TEMP/react-native-pdf-thumbnail.tgz"
          echo "LIBRARY_TARBALL=$RUNNER_TEMP/react-native-pdf-thumbnail.tgz" >> "$GITHUB_ENV"
          echo "SMOKE_APP=$RUNNER_TEMP/SmokeApp" >> "$GITHUB_ENV"

      - name: Generate fresh app
        working-directory: ${{ runner.temp }}
        env:
          RN_VERSION: ${{ matrix.rn }}
        run: >-
          npx @react-native-community/cli@latest init SmokeApp
          --version "$RN_VERSION" --skip-git-init --install-pods false --pm npm

      - name: Install packed library
        working-directory: ${{ env.SMOKE_APP }}
        run: npm install "$LIBRARY_TARBALL"

      - name: Exercise library import
        working-directory: ${{ env.SMOKE_APP }}
        shell: bash
        run: |
          cat > App.tsx <<'APP'
          import React, {useEffect} from 'react';
          import {Text, View} from 'react-native';
          import PdfThumbnail from 'react-native-pdf-thumbnail';

          export default function App() {
            useEffect(() => {
              PdfThumbnail.generate('file:///smoke.pdf', 0).catch(console.warn);
            }, []);
            return <View><Text>PDF thumbnail smoke app</Text></View>;
          }
          APP

      # The app's unmodified Jest setup must load the library (via its CommonJS
      # entry) when rendering App.tsx.
      - name: Test consumer library import
        working-directory: ${{ env.SMOKE_APP }}
        run: npm test -- --runInBand

      # Debug native builds normally skip bundling, so exercise Metro explicitly.
      - name: Bundle app with Metro
        working-directory: ${{ env.SMOKE_APP }}
        env:
          SMOKE_PLATFORM: ${{ matrix.platform }}
        run: >-
          npx react-native bundle --platform "$SMOKE_PLATFORM" --dev false
          --entry-file index.js --bundle-output "$RUNNER_TEMP/smoke.bundle"
          --assets-dest "$RUNNER_TEMP/smoke-assets"

      - name: Build Android app
        if: matrix.platform == 'android'
        working-directory: ${{ env.SMOKE_APP }}/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a

      - name: Assert Android autolinking namespace
        if: matrix.platform == 'android'
        working-directory: ${{ env.SMOKE_APP }}/android
        shell: bash
        run: |
          PACKAGE_LIST=$(find app/build/generated -name PackageList.java -print -quit)
          test -n "$PACKAGE_LIST"
          # RN 0.76 emits an import; newer versions use the fully qualified name inline.
          grep -F 'org.songsterq.pdfthumbnail.PdfThumbnailPackage' "$PACKAGE_LIST"
          ! grep -F 'com.pdfthumbnail.' "$PACKAGE_LIST"

      - name: Assert Android codegen output
        if: matrix.platform == 'android'
        working-directory: ${{ env.SMOKE_APP }}
        shell: bash
        run: |
          SPEC=node_modules/react-native-pdf-thumbnail/android/build/generated/source/codegen/java/org/songsterq/pdfthumbnail/NativePdfThumbnailSpec.java
          test -f "$SPEC"
          grep -F 'abstract class NativePdfThumbnailSpec' "$SPEC"

      - name: Install iOS dependencies
        if: matrix.platform == 'ios'
        working-directory: ${{ env.SMOKE_APP }}/ios
        run: bundle install && bundle exec pod install

      - name: Build iOS app
        if: matrix.platform == 'ios'
        working-directory: ${{ env.SMOKE_APP }}/ios
        run: >-
          xcodebuild -workspace SmokeApp.xcworkspace -scheme SmokeApp
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

      - name: Assert iOS codegen output
        if: matrix.platform == 'ios'
        working-directory: ${{ env.SMOKE_APP }}
        shell: bash
        run: |
          SPEC=ios/build/generated/ios/PdfThumbnailSpec/PdfThumbnailSpec.h
          test -f "$SPEC"
          grep -F '@protocol NativePdfThumbnailSpec' "$SPEC"
          grep -F 'class JSI_EXPORT NativePdfThumbnailSpecJSI' "$SPEC"
