name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

      - name: Build package types
        run: yarn prepare

      - name: Check documentation samples
        run: yarn docs:check

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  build-android:
    runs-on: ubuntu-latest

    env:
      TURBO_CACHE_DIR: .turbo/android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for Android
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: |
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"

  build-ios:
    runs-on: macos-latest

    env:
      XCODE_VERSION: latest-stable
      TURBO_CACHE_DIR: .turbo/ios
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for iOS
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-

      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Use appropriate Xcode version
        if: env.turbo_cache_hit != 1
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache CocoaPods
        if: env.turbo_cache_hit != 1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock', 'example/Gemfile.lock') }}

      - name: Install cocoapods
        if: env.turbo_cache_hit != 1
        run: |
          cd example
          bundle install
          bundle exec pod install --project-directory=ios

      - name: Build example for iOS
        run: |
          yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}"

  smoke:
    name: Smoke RN ${{ matrix.rn }} (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
    strategy:
      fail-fast: false
      matrix:
        rn: ['0.76.9', 'latest']
        platform: [android, ios]
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
        exclude:
          # RN 0.76's bundled fmt fails to compile with current Xcode (consteval
          # errors), independent of this library.
          - rn: '0.76.9'
            platform: ios
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select stable Xcode
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        if: matrix.platform == 'android'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build and pack library
        shell: bash
        run: |
          yarn prepare
          # yarn pack runs only `prepack` (none here), unlike npm pack which rebuilds.
          yarn pack --out "$RUNNER_TEMP/react-native-pdf-thumbnail.tgz"
          echo "LIBRARY_TARBALL=$RUNNER_TEMP/react-native-pdf-thumbnail.tgz" >> "$GITHUB_ENV"
          echo "SMOKE_APP=$RUNNER_TEMP/SmokeApp" >> "$GITHUB_ENV"

      - name: Generate fresh app
        working-directory: ${{ runner.temp }}
        env:
          RN_VERSION: ${{ matrix.rn }}
        run: >-
          npx @react-native-community/cli@latest init SmokeApp
          --version "$RN_VERSION" --skip-git-init --install-pods false --pm npm

      - name: Install packed library
        working-directory: ${{ env.SMOKE_APP }}
        run: npm install "$LIBRARY_TARBALL"

      - name: Exercise library import
        working-directory: ${{ env.SMOKE_APP }}
        shell: bash
        run: |
          cat > App.tsx <<'APP'
          import React, {useEffect} from 'react';
          import {Text, View} from 'react-native';
          import PdfThumbnail from 'react-native-pdf-thumbnail';

          export default function App() {
            useEffect(() => {
              PdfThumbnail.generate('file:///smoke.pdf', 0).catch(console.warn);
            }, []);
            return <View><Text>PDF thumbnail smoke app</Text></View>;
          }
          APP

      # The app's unmodified Jest setup must load the library (via its CommonJS
      # entry) when rendering App.tsx.
      - name: Test consumer library import
        working-directory: ${{ env.SMOKE_APP }}
        run: npm test -- --runInBand

      # Debug native builds normally skip bundling, so exercise Metro explicitly.
      - name: Bundle app with Metro
        working-directory: ${{ env.SMOKE_APP }}
        env:
          SMOKE_PLATFORM: ${{ matrix.platform }}
        run: >-
          npx react-native bundle --platform "$SMOKE_PLATFORM" --dev false
          --entry-file index.js --bundle-output "$RUNNER_TEMP/smoke.bundle"
          --assets-dest "$RUNNER_TEMP/smoke-assets"

      - name: Build Android app
        if: matrix.platform == 'android'
        working-directory: ${{ env.SMOKE_APP }}/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a

      - name: Assert Android autolinking namespace
        if: matrix.platform == 'android'
        working-directory: ${{ env.SMOKE_APP }}/android
        shell: bash
        run: |
          PACKAGE_LIST=$(find app/build/generated -name PackageList.java -print -quit)
          test -n "$PACKAGE_LIST"
          # RN 0.76 emits an import; newer versions use the fully qualified name inline.
          grep -F 'org.songsterq.pdfthumbnail.PdfThumbnailPackage' "$PACKAGE_LIST"
          ! grep -F 'com.pdfthumbnail.' "$PACKAGE_LIST"

      - name: Assert Android codegen output
        if: matrix.platform == 'android'
        working-directory: ${{ env.SMOKE_APP }}
        shell: bash
        run: |
          SPEC=node_modules/react-native-pdf-thumbnail/android/build/generated/source/codegen/java/org/songsterq/pdfthumbnail/NativePdfThumbnailSpec.java
          test -f "$SPEC"
          grep -F 'abstract class NativePdfThumbnailSpec' "$SPEC"

      - name: Install iOS dependencies
        if: matrix.platform == 'ios'
        working-directory: ${{ env.SMOKE_APP }}/ios
        run: bundle install && bundle exec pod install

      - name: Build iOS app
        if: matrix.platform == 'ios'
        working-directory: ${{ env.SMOKE_APP }}/ios
        run: >-
          xcodebuild -workspace SmokeApp.xcworkspace -scheme SmokeApp
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

      - name: Assert iOS codegen output
        if: matrix.platform == 'ios'
        working-directory: ${{ env.SMOKE_APP }}
        shell: bash
        run: |
          # The codegen output layout differs across RN versions (RN 0.87 adds ReactCodegen/).
          SPEC=$(find ios/build/generated -path '*/PdfThumbnailSpec/PdfThumbnailSpec.h' -print -quit)
          test -n "$SPEC"
          grep -F '@protocol NativePdfThumbnailSpec' "$SPEC"
          grep -F 'class JSI_EXPORT NativePdfThumbnailSpecJSI' "$SPEC"

  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '17'
      - name: Install Maestro
        uses: ./.github/actions/setup-maestro
      - name: Install image comparison dependency
        run: python3 -m pip install pillow
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Cache API 36 AVD snapshot
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd
            ~/.android/adb*
          key: ${{ runner.os }}-avd-api36-google-apis-x86_64-v1
      - name: Create AVD snapshot on cache miss
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel
          avd-name: phase4-api36
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: echo 'Created API 36 AVD snapshot'
      - name: Build Release example
        working-directory: example/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Run self-test and pull exports
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel
          avd-name: phase4-api36
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: bash .github/scripts/e2e-android.sh
      - name: Compare golden JPEGs
        run: python3 scripts/compare-goldens.py android artifacts/android/selftest
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-android-failure
          path: artifacts/android
          if-no-files-found: warn

  e2e-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install JDK for Maestro
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '17'
      - name: Install Maestro
        uses: ./.github/actions/setup-maestro
      - name: Install image comparison dependency
        run: python3 -m pip install --break-system-packages pillow
      - name: Install pods
        working-directory: example
        run: |
          bundle install
          bundle exec pod install --project-directory=ios
      - name: Select simulator by available iPhone name
        shell: bash
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os, re
          with open(os.environ['RUNNER_TEMP'] + '/simulators.json') as source:
              runtimes = json.load(source)['devices']
          ios = [key for key in runtimes if '.iOS-' in key]
          ios.sort(key=lambda key: tuple(map(int, re.findall(r'\d+', key))), reverse=True)
          phones = [device for runtime in ios for device in runtimes[runtime]
                    if device.get('isAvailable') and device['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator; install an iOS runtime')
          phone = next((device for device in phones if device['name'] == 'iPhone 18 Pro'), phones[0])
          print('Selected ' + phone['name'] + ': ' + phone['udid'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('IOS_SIMULATOR_NAME=' + phone['name'] + '\n')
              env.write('IOS_SIMULATOR_UDID=' + phone['udid'] + '\n')
              env.write('IOS_SIMULATOR_STATE=' + phone['state'] + '\n')
          PY
      - name: Boot simulator
        run: |
          if [[ "$IOS_SIMULATOR_STATE" != Booted ]]; then
            xcrun simctl boot "$IOS_SIMULATOR_UDID"
          fi
          xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b
      - name: Build Release example
        working-directory: example/ios
        run: >-
          xcodebuild -workspace PdfThumbnailExample.xcworkspace
          -scheme PdfThumbnailExample -configuration Release -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID"
          -derivedDataPath "$RUNNER_TEMP/pdf-thumbnail-derived"
          CODE_SIGNING_ALLOWED=NO
      - name: Install and run self-test
        run: |
          mkdir -p artifacts/ios
          xcrun simctl install "$IOS_SIMULATOR_UDID" \
            "$RUNNER_TEMP/pdf-thumbnail-derived/Build/Products/Release-iphonesimulator/PdfThumbnailExample.app"
          maestro --device "$IOS_SIMULATOR_UDID" test --format junit \
            --output artifacts/ios/maestro.xml --test-output-dir artifacts/ios/maestro \
            --debug-output artifacts/ios/maestro-debug \
            .maestro/selftest.yaml
      - name: Pull exports even after a failed Maestro run
        if: always() && env.IOS_SIMULATOR_UDID != ''
        run: |
          mkdir -p artifacts/ios
          CONTAINER=$(xcrun simctl get_app_container "$IOS_SIMULATOR_UDID" org.songsterq.pdfthumbnail.example data)
          cp -R "$CONTAINER/Documents/selftest" artifacts/ios/selftest
      - name: Compare golden JPEGs
        run: python3 scripts/compare-goldens.py ios artifacts/ios/selftest
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-ios-failure
          path: artifacts/ios
          if-no-files-found: warn

  smoke-expo:
    name: Smoke Expo (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select stable Xcode
        if: matrix.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install JDK
        if: matrix.platform == 'android'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '17'
      - name: Build and pack library
        run: |
          yarn prepare
          yarn pack --out "$RUNNER_TEMP/react-native-pdf-thumbnail.tgz"
          echo "LIBRARY_TARBALL=$RUNNER_TEMP/react-native-pdf-thumbnail.tgz" >> "$GITHUB_ENV"
          echo "SMOKE_APP=$RUNNER_TEMP/ExpoSmoke" >> "$GITHUB_ENV"
      - name: Generate latest Expo app
        working-directory: ${{ runner.temp }}
        # A blank TypeScript template gives us a stable App.tsx entrypoint.
        run: npx create-expo-app@latest ExpoSmoke --template blank-typescript --yes
      - name: Install packed library
        working-directory: ${{ env.SMOKE_APP }}
        run: npm install "$LIBRARY_TARBALL"
      - name: Exercise public API in consumer entrypoint
        working-directory: ${{ env.SMOKE_APP }}
        run: |
          cat > App.tsx <<'APP'
          import {useEffect} from 'react';
          import {Text, View} from 'react-native';
          import PdfThumbnail from 'react-native-pdf-thumbnail';
          export default function App() {
            useEffect(() => {
              PdfThumbnail.generate('file:///smoke.pdf', 0).catch(console.warn);
            }, []);
            return <View><Text>PDF thumbnail Expo smoke</Text></View>;
          }
          APP
      - name: Run consumer Jest tests when provided by template
        working-directory: ${{ env.SMOKE_APP }}
        run: |
          node - <<'JS'
          const fs = require('fs');
          const {spawnSync} = require('child_process');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.scripts?.test) {
            const result = spawnSync('npm', ['test', '--', '--runInBand', '--watch=false'], {stdio: 'inherit'});
            if (result.error) throw result.error;
            process.exit(result.status ?? 1);
          }
          console.log('Template supplies no test script; no consumer Jest test to run.');
          JS
      - name: Expo prebuild without a config plugin
        working-directory: ${{ env.SMOKE_APP }}
        env:
          CI: '1'
          SMOKE_PLATFORM: ${{ matrix.platform }}
        run: npx expo prebuild --platform "$SMOKE_PLATFORM" --no-install
      - name: Install dependencies added by prebuild
        working-directory: ${{ env.SMOKE_APP }}
        run: npm install
      - name: Build Android with bundled JavaScript
        if: matrix.platform == 'android'
        working-directory: ${{ env.SMOKE_APP }}/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Assert Android native autolinking
        if: matrix.platform == 'android'
        working-directory: ${{ env.SMOKE_APP }}/android
        run: |
          PACKAGE_LIST=$(find app/build/generated -name PackageList.java -print -quit)
          test -n "$PACKAGE_LIST"
          grep -F 'org.songsterq.pdfthumbnail.PdfThumbnailPackage' "$PACKAGE_LIST"
      - name: Install iOS pods
        if: matrix.platform == 'ios'
        working-directory: ${{ env.SMOKE_APP }}/ios
        run: pod install
      - name: Build iOS with bundled JavaScript
        if: matrix.platform == 'ios'
        working-directory: ${{ env.SMOKE_APP }}/ios
        run: >-
          xcodebuild -workspace ExpoSmoke.xcworkspace -scheme ExpoSmoke
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/expo-smoke-derived"
          CODE_SIGNING_ALLOWED=NO
      - name: Assert iOS native codegen
        if: matrix.platform == 'ios'
        working-directory: ${{ env.SMOKE_APP }}
        run: |
          SPEC=$(find ios/build/generated -path '*/PdfThumbnailSpec/PdfThumbnailSpec.h' -print -quit)
          test -n "$SPEC"
          grep -F '@protocol NativePdfThumbnailSpec' "$SPEC"
