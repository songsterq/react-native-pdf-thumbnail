version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      react-native:
        patterns:
          - react
          - react-native
          - '@react-native/*'
          - '@react-native-community/cli*'
          - '@types/react'
        update-types:
          - minor
          - patch
      dev-tooling:
        dependency-type: development
        patterns:
          - '*'
        exclude-patterns:
          - react
          - react-native
          - '@react-native/*'
          - '@react-native-community/cli*'
          - '@types/react'
        update-types:
          - minor
          - patch
    ignore:
      # Root React/RN majors move deliberately with the example app.
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-native
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /example
    schedule:
      interval: weekly
    groups:
      react-native:
        patterns:
          - react
          - react-native
          - '@react-native/*'
          - '@react-native-community/cli*'
          - '@types/react'
        update-types:
          - minor
          - patch
      dev-tooling:
        dependency-type: development
        patterns:
          - '*'
        exclude-patterns:
          - react
          - react-native
          - '@react-native/*'
          - '@react-native-community/cli*'
          - '@types/react'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: bundler
    directory: /example
    schedule:
      interval: monthly
